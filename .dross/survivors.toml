[[category]]
  name = "policy-duplicate-key"
  reason = "Reachable only through a duplicate YAML mapping key (two permissions blocks, or two identical contents: read children). GitHub rejects such a workflow as invalid, so no runnable workflow reaches this branch."

[[category]]
  name = "policy-equivalent"
  reason = "Equivalent mutant: the mutated value can never differ at this point (KEY captures carry no surrounding whitespace on trimmed, comment-stripped lines; checkPermissions/uses lines always match KEY so the optional-chain and '' fallback are dead; no permission scope is named 'Stryker was here'; workflow-level checks never read the writable list)."

[[category]]
  name = "node-pinned"
  reason = "Entry-guard fallback for Node < 24.2 (no import.meta.main). .node-version pins 24.14.0, where import.meta.main is always a boolean, so the argv fallback never runs and ?? vs && is equivalent; the CLI itself was observed exiting 1 on an unpinned workflow."

[[category]]
  name = "temp-dir-redundant-guard"
  reason = "Equivalent: LOCKED.has(undefined) is false, so dropping the code !== undefined guard cannot change the outcome."

[[category]]
  name = "ddl-metadata"
  reason = "drizzle column names, references() targets and onDelete options only feed drizzle-kit generate; runtime DDL and FKs come from the committed migration SQL (0009/0010/0011, pinned by migrate.spec 'install-owned schema'/'schema matches snapshot' and channel.schema.spec cascade tests), and an empty column name falls back to the property key, which equals the column name here"

[[category]]
  name = "open-config-ok-false"
  reason = "Equivalent: openConfig callers only read .ok (opened.ok, previous?.ok, !opened.ok), and {}.ok is undefined, which is falsy exactly like false"

