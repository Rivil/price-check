wave          = 2
depends_on    = ["t-1"]
title         = "Add main window with external-link policy"
files         = ["src/desktop/window.ts", "src/desktop/window.spec.ts"]
description   = '''
createMainWindow(deps, origin): contextIsolation true, nodeIntegration false, sandbox true, no preload. setWindowOpenHandler always denies (http/https off-origin -> shell.openExternal; same-origin -> load in this window). Off-origin will-navigate and will-redirect are prevented. Close destroys the window and never preventDefaults. showWindow(state) recreates a destroyed/never-created window, restores a minimised one, then shows and focuses. Electron types via `import type` only.
'''
covers        = ["c-5", "c-7"]
test_contract = [
  '''if webPreferences lack contextIsolation:true, sandbox:true, nodeIntegration:false, or set a preload, window.spec fails''',
  '''if window.open/target=_blank to 'https://www.amazon.co.uk/dp/B0X' or 'https://ntfy.sh/t' returns anything but {action:'deny'}, or openExternal is not called exactly once with that URL, window.spec fails''',
  '''if 'file:///etc/passwd', 'javascript:alert(1)', 'smb://h/s' or 'ms-msdt:x' reaches shell.openExternal, window.spec's scheme table fails''',
  '''if will-navigate to 'https://evil.example/' or 'http://127.0.0.1:<other port>/' is not prevented, a same-origin '/watches/1' navigation is prevented, or an off-origin will-redirect is let through, window.spec fails''',
  '''if the window's 'close' event is preventDefault-ed (quit would hang behind it), window.spec fails''',
  '''if showWindow after the window was destroyed does not create exactly one new window, a minimised window is not restore()d, or showWindow on a visible window creates a second BrowserWindow, window.spec fails''',
]
status        = "done"

