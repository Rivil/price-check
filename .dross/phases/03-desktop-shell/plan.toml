[[task]]
id            = "t-1"
wave          = 1
title         = "Add Electron toolchain and desktop bundle build"
files         = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".gitignore", "scripts/build-desktop.ts", "scripts/build-desktop.spec.ts"]
description   = '''
electron (exact pin: newest stable whose bundled Node major equals .node-version's 24) and esbuild (exact pin) as direct devDependencies; onlyBuiltDependencies [electron, esbuild]. scripts/build-desktop.ts (script build:desktop) bundles an entry (default src/desktop/main.ts) to dist-desktop/main.js: ESM, platform node, electron external, #lib/* inlined; rejects $app/*, @libsql/*, drizzle-orm/libsql imports. package.json main = dist-desktop/main.js; /dist-desktop gitignored. Spec fixtures go through esbuild stdin with resolveDir = repo root, so no fixture file needs to typecheck. Run pnpm install after the onlyBuiltDependencies edit so the electron binary is present.
'''
covers        = ["c-1"]
test_contract = [
  '''if pnpm-workspace.yaml onlyBuiltDependencies is not exactly ['electron','esbuild'] (a wildcard, a missing electron, or any extra package), build-desktop.spec fails''',
  '''if electron's postinstall was denied, the path the 'electron' package exports does not exist and build-desktop.spec 'electron binary installed' fails''',
  '''if electron or esbuild in package.json carries ^, ~, a range or a tag instead of an exact x.y.z, build-desktop.spec fails''',
  '''if a fixture entry importing 'electron' and '#lib/server/local-request.ts' builds to an output that inlines electron, or still contains a '#lib/' specifier (Electron cannot resolve it to .ts), build-desktop.spec fails''',
  '''if a fixture entry importing '$app/env', '@libsql/client' or 'drizzle-orm/libsql' builds instead of failing with an error naming the import, build-desktop.spec fails''',
  '''if package.json main !== the build's outfile ('dist-desktop/main.js'), the default entry is not src/desktop/main.ts, or the output contains the repo's absolute path, build-desktop.spec fails''',
  '''if .gitignore does not ignore /dist-desktop (prettier and eslint would then scan the bundle), build-desktop.spec fails''',
]
status        = "done"

[[task]]
id            = "t-2"
wave          = 1
title         = "Expose scheduler and DB controls to main"
files         = ["src/lib/server/scheduler.ts", "src/lib/server/scheduler.spec.ts", "src/lib/server/runtime-bridge.ts", "src/lib/server/runtime-bridge.spec.ts", "src/hooks.server.ts", "src/hooks.server.spec.ts"]
description   = '''
Scheduler gains requestPass() (runs now if idle, else queues exactly one follow-up pass) and async stop(drainMs) (clears the interval, awaits the in-flight pass up to drainMs). startScheduler returns {requestPass, stop} | null; its one consumer, hooks.server.ts, changes in this task. runtime-bridge.ts (no $app imports) publishes/reads globalThis[Symbol.for('price-check.runtime')]. hooks init publishes {requestPass, stop, closeDb}, with no-op controls when the scheduler is null and closeDb = db.$client.close (idempotent).
'''
covers        = ["c-8", "c-9"]
test_contract = [
  '''if requestPass() during a running pass is dropped (tick()'s overlap guard returns null), scheduler.spec 'resume mid-pass' fails: after the running pass resolves exactly one more pass must run, and its due(now) must receive the post-resume clock''',
  '''if a fake clock jumps 8h (sleep) and the resume pass's due() is called with the pre-sleep time, or a watch that came due during the jump is not checked, scheduler.spec 'due during sleep' fails''',
  '''if, with three watches last checked at t0 and now() jumped to t0 + 3 intervals, one requestPass() over a migrated test DB does not call checkOne for all three in one pass, scheduler.spec 'catch-up after sleep' fails''',
  '''if two requestPass() calls during one pass yield two follow-up passes (pile-up), or a requestPass() while idle does not start a pass synchronously, scheduler.spec fails''',
  '''if stop() resolves while a checkOne is still pending (deferred promise unresolved) and drainMs has not elapsed, scheduler.spec fails (quit would close the db under a pass)''',
  '''if stop() leaves the interval armed (fake timers advanced 3 x TICK_MS after stop call due() again), or a pass that never settles makes stop() hang past drainMs, scheduler.spec 'stop drains' fails''',
  '''if startScheduler with SCHEDULER_DISABLED='1', VITEST set or building does not return null, scheduler.spec fails (r-01: no live check from any test run)''',
  '''if two module instances (vi.resetModules + re-import, as the server bundle and the main bundle are) do not see the same published runtime, or reading before publish does anything but throw 'server runtime not published', runtime-bridge.spec fails''',
  '''if closeDb() closes the client twice when called twice, runtime-bridge.spec fails''',
  '''if hooks init order is not ['key','migrated','scheduler','published'], the published controls are not the startScheduler result's, closeDb does not call the db's $client.close, or a disabled scheduler (startScheduler -> null) publishes no controls or controls whose requestPass throws or whose stop() rejects, hooks.server.spec fails''',
]
status        = "done"

[[task]]
id            = "t-3"
wave          = 1
title         = "Bootstrap first launch: paths, key, env"
files         = ["src/desktop/app-paths.ts", "src/desktop/app-paths.spec.ts", "src/desktop/alerts-key.ts", "src/desktop/alerts-key.spec.ts", "src/desktop/server-env.ts", "src/desktop/server-env.spec.ts"]
description   = '''
resolveUserDataDir({appData, isPackaged, env}) -> <appData>/price-check, overridable by PRICE_CHECK_USER_DATA only when unpackaged; desktopPaths -> dbFile, keyFile. loadOrCreateAlertsKey(keyFile): mkdir -p, create via temp file + exclusive link (mode 0600), never rewrite an existing key, refuse a bad one. serverEnv(inherited, {dbFile, key}) builds the env the adapter handler is imported under. No non-spec module here imports #lib/server/db/* (only specs may).
'''
covers        = ["c-1", "c-2"]
test_contract = [
  '''if a second loadOrCreateAlertsKey on the same file returns different bytes, or the file's sha256 changes, alerts-key.spec 'never regenerated' fails; a value sealed with encryptSecret under launch 1's key must decryptSecret under launch 2's key (c-2)''',
  '''if the key written on an empty dir is not accepted by parseAlertsKey, alerts-key.spec fails''',
  '''if an existing key file that is empty, truncated, non-base64 or 31/33 bytes decoded is replaced instead of throwing an error that names the file path (and the file stays byte-identical), alerts-key.spec 'bad key refused' fails''',
  '''if two concurrent first-launch calls (Promise.all) return different keys, or a key created between the existence check and the write is overwritten, alerts-key.spec fails''',
  '''if a leftover 'alerts.key.tmp-*' from an interrupted write is read as the key or blocks creation, alerts-key.spec fails''',
  '''on POSIX (skipIf win32), if the created file's mode & 0o777 !== 0o600, alerts-key.spec fails; if any thrown message contains the key's base64 or the file's contents, alerts-key.spec fails''',
  '''if a missing nested userData dir makes first launch throw, alerts-key.spec fails''',
  '''if packaged resolveUserDataDir honours PRICE_CHECK_USER_DATA, or the dir name is not exactly 'price-check' under appData, app-paths.spec fails''',
  '''if inherited ORIGIN, HOST_HEADER, PORT_HEADER, ADDRESS_HEADER survive serverEnv, or an inherited PROTOCOL_HEADER/DATABASE_URL/ALERTS_ENCRYPTION_KEY wins over the desktop's own values (PROTOCOL_HEADER must be 'x-forwarded-proto'), server-env.spec fails''',
  '''if SCHEDULER_DISABLED or CHECK_INTERVAL_HOURS are not passed through, server-env.spec fails''',
  '''if DATABASE_URL for a userData dir named 'Application Support Zoë #1 50%' does not let createDb + migrateDb create exactly <dir>/price-check.db (existsSync true, no stray file in cwd), server-env.spec 'awkward path' fails''',
]
status        = "done"

[[task]]
id            = "t-4"
wave          = 1
title         = "Add loopback http wrapper and handler loader"
files         = ["src/desktop/server.ts", "src/desktop/server.spec.ts", "src/desktop/testing/fake-handler.ts"]
description   = '''
startDesktopServer({handler}) listens on 127.0.0.1 port 0. For every request, Host is checked first with isLoopbackHost (403 text, handler never called), client X-Forwarded-Proto/X-Forwarded-Host are removed, X-Forwarded-Proto is set to 'http', then handler(req,res). close() ends keep-alive sockets. loadAdapterHandler(env, moduleUrl, appRoot) assigns env to process.env and chdir(appRoot) (migrate.ts resolves drizzle/ from cwd) BEFORE the dynamic import. The spec restores cwd after each test.
'''
covers        = ["c-1", "c-3", "c-4", "c-9"]
test_contract = [
  '''if server.address() is not {address:'127.0.0.1', family IPv4, port>0}, or two starts share a port, server.spec fails; if a non-internal IPv4 interface exists, connecting to it at that port must be refused (skip when none)''',
  '''if a request with Host 'evil.example' to '/_app/immutable/chunks/x.js', '/health' or '/' reaches the handler, or gets anything but 403, server.spec's host table fails; a raw request with no Host (setHost: false) must also 403 without reaching the handler; Host '127.0.0.1:<port>' and 'localhost:<port>' pass''',
  '''if a client-sent 'X-Forwarded-Proto: https' (or 'https, http') reaches the handler as anything but exactly one 'http' value, or X-Forwarded-Host survives, server.spec fails (adapter-node would build an https origin and Kit's CSRF check would 403 every POST)''',
  '''if close() with an idle keep-alive connection open takes over 1s, or the port still accepts a connection after close() resolves, server.spec 'close with keep-alive' fails''',
  '''if loadAdapterHandler imports the fixture module (src/desktop/testing/fake-handler.ts, which records process.env.PROTOCOL_HEADER and process.cwd() at top level) before assigning env and chdir-ing, the recorded PROTOCOL_HEADER is not 'x-forwarded-proto' or the recorded cwd is not appRoot, and server.spec 'env and cwd before import' fails''',
]
status        = "done"

[[task]]
