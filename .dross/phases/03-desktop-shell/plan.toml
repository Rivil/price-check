description   = '''
runDesktop(deps) with every step injected through structural interfaces declared in this file (no imports from window/tray/login-item/server/alerts-key; types only from runtime-bridge): set userData, requestSingleInstanceLock, whenReady, loadKey, startServer, read runtime, tray, register login item, window unless login launch. Handlers for second-instance, window-all-closed (no-op), activate, powerMonitor resume (runtime.requestPass), before-quit shutdown with a deadline, and startup failure.
'''
covers        = ["c-5", "c-6", "c-7", "c-8", "c-9"]
test_contract = [
  '''if a lost single-instance lock still calls loadKey, startServer, createTray or createWindow (a second DB/server/key access), or does not call app.quit, lifecycle.spec fails''',
  '''if setPath('userData') is recorded after requestSingleInstanceLock in the call-order log (the lock is keyed by userData), lifecycle.spec fails''',
  '''if 'second-instance' does not call showWindow, or 'activate' with no window does not, lifecycle.spec fails''',
  '''if no 'window-all-closed' listener is registered (Electron's default quits on Windows/Linux), or it calls app.quit, runtime.stop or server.close on win32, linux or darwin, lifecycle.spec fails''',
  '''if a login launch creates a window, a normal launch creates other than one, the tray is not created in both, or the login-item registration is not attempted once per startup, lifecycle.spec fails''',
  '''if powerMonitor 'resume' does not call runtime.requestPass exactly once per event, the listener is attached before whenReady resolves, or a disabled runtime (no-op controls) makes it throw, lifecycle.spec fails''',
  '''if before-quit does not run exactly [runtime.stop, server.close, runtime.closeDb, app.exit(0)] in that order, calls exit before closeDb resolves, runs again on a second before-quit during shutdown, or a step that throws, rejects or hangs past the shutdown deadline stops app.exit from being called, lifecycle.spec fails''',
  '''if a loadKey throw (bad key file) or a startServer rejection does not end in dialog.showErrorBox (message names the file, contains no key base64) then app.exit(1) with no tray created (a zombie instance would hold the lock and swallow every relaunch), lifecycle.spec fails''',
]
status        = "done"

