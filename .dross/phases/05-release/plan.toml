[[task]]
id            = "t-2"
wave          = 2
depends_on    = ["t-1"]
title         = "Write electron-builder config and package CLI"
files         = ["scripts/package-desktop.ts", "scripts/package-desktop.spec.ts", "package.json", ".gitignore"]
description   = '''
Pure builderConfig({version, feedUrl?, sign}) -> electron-builder Configuration (type-only import; appId imported from src/desktop/app-id.ts), plus exported PRODUCT_NAME and artifactName patterns. packageDesktop() runs electron-builder's build() (injected in tests) for the host OS only, publish 'never'. CLI `pnpm package:desktop --version <v> [--feed-url <loopback>] [--sign] [--out <dir>]` refuses when build/handler.js or dist-desktop/main.js is missing. Unsigned runs set CSC_IDENTITY_AUTO_DISCOVERY=false; --sign on darwin refuses unless CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY (existing non-empty file), APPLE_API_KEY_ID and APPLE_API_ISSUER are set, naming only the missing ones. directories.buildResources moved off 'build'. Output /dist-packaged gitignored. Executor observes `pnpm package:desktop --version 0.1.4` produce dist-packaged/mac-universal/<PRODUCT_NAME>.app locally before committing.
'''
covers        = ["c-1", "c-2", "c-3", "c-4", "c-5"]
test_contract = ["if builderConfig().appId !== APP_ID, or package-desktop.ts source contains the literal 'io.github.rivil.price-check' (must be imported, decision artefacts), package-desktop.spec fails (c-3 AUMID drift)", "if mac.target is not exactly dmg and zip each with arch ['universal'], or any mac target names arm64 or x64, package-desktop.spec fails (c-2)", "if mac.x64ArchFiles does not match both …/app.asar.unpacked/node_modules/@libsql/darwin-x64/index.node and the darwin-arm64 one, or does match a path under Contents/Frameworks (too broad, hides a missing lipo), package-desktop.spec fails", "if win.target is not exactly [{target:'nsis', arch:['x64']}], or nsis.oneClick !== true, or nsis.perMachine !== false (a UAC prompt), package-desktop.spec fails (c-3)", "if linux.target is not exactly [{target:'AppImage', arch:['x64']}] (deb/rpm/snap are a milestone non-goal), or any linux executableArgs contains '--no-sandbox', package-desktop.spec fails", "if asar !== true, or asarUnpack does not match node_modules/libsql/index.js, node_modules/@libsql/linux-x64-gnu/index.node, node_modules/@libsql/win32-x64-msvc/index.node, both darwin index.node paths and drizzle/0000_little_dreaming_celestial.sql, or npmRebuild !== false, package-desktop.spec fails (c-1 libsql outside asar, never rebuilt)", "if directories.buildResources is 'build' or unset (electron-builder never packs its buildResources dir, which would drop adapter-node's build/handler.js), package-desktop.spec fails", "if the files patterns (applied in order, negations included) leave out dist-desktop/main.js, build/handler.js, src/desktop/assets/tray-iconTemplate.png or drizzle/meta/_journal.json, or take in local.db, any *.db, .env, src/desktop/main.ts, src/lib/**, e2e/desktop/launch.ts, .dross/**, scripts/** or test-results/x, package-desktop.spec fails", "if any artifactName expansion for any target contains whitespace (GitHub renames 'Price Check' assets to 'Price.Check' and latest*.yml then 404s), package-desktop.spec fails", "if detectUpdateChannel !== false (an rc build would write rc*.yml instead of the latest*.yml c-4 publishes, and rc installs would poll rc.yml), package-desktop.spec fails", "if no feedUrl does not give publish [{provider:'github', owner:'Rivil', repo:'price-check'}], or feedUrl 'http://127.0.0.1:47811/' does not give [{provider:'generic', url}], or 'https://example.com/' or 'http://10.0.0.1/' does not throw (only a loopback test feed may be baked in, decision update_flow), or sign:true accepts any feedUrl, package-desktop.spec fails", "if extraMetadata.version is not the given version for '0.1.5' and '0.1.5-rc.1', or '0.1', 'v0.1.5', '0.1.5-rc', 'latest' or '' does not throw, package-desktop.spec fails (c-4 stamping)", "if sign:false does not give mac.identity === null, mac.notarize false and env CSC_IDENTITY_AUTO_DISCOVERY === 'false', or sign:true does not give mac.notarize === true and hardenedRuntime === true, or win has any certificate*, signtool* or azureSign* key in either mode, package-desktop.spec fails", "if a --sign run with any of the five variables missing or blank, or APPLE_API_KEY naming a missing or empty file, reaches build(), package-desktop.spec fails (c-4 \"missing Apple credential publishes nothing\")", "if stdout or stderr of a refused --sign run contains any sentinel value seeded in the five variables, package-desktop.spec fails (names only, never values)", "if build() is ever called with publish other than 'never', or for an OS other than the host ('--win' on darwin accepted), or with build/handler.js or dist-desktop/main.js missing, package-desktop.spec fails", "if .gitignore lacks /dist-packaged, or the package:desktop script is not 'node scripts/package-desktop.ts', package-desktop.spec fails", "if asarUnpack does not also match drizzle/meta/_journal.json and the newest migration drizzle/0011_drop_auth.sql (the migrator reads the whole folder from app.asar.unpacked), package-desktop.spec fails", "if the linux config's files/unpack patterns admit @libsql/linux-arm64-* or any musl build, the win config admits any @libsql package but win32-x64-msvc, or the mac config admits any non-darwin @libsql package (t-1 installs every arch on every host), package-desktop.spec fails"]
status        = "done"

[[task]]
id            = "t-3"
wave          = 2
depends_on    = ["t-1"]
title         = "Gate release tags, create release environment"
files         = ["scripts/release-tag.ts", "scripts/release-tag.spec.ts", ".github/environments/release.json", "scripts/environments.spec.ts"]
description   = '''
release-tag.ts (Node built-ins only, type stripping, so the tag job runs no dependency code) exports checkReleaseTag({ref, packageVersion, onMain}) -> {ok, version, prerelease} | {ok:false, reason}, and isOnMain(sha, cwd) via `git merge-base --is-ancestor <sha> origin/main`; its CLI writes version= and prerelease= to $GITHUB_OUTPUT only on success. release.json holds the environment as applied: deployment_branch_policy {protected_branches:false, custom_branch_policies:true}, policies [{name:'v*', type:'tag'}], no reviewers, no secrets. Executor applies it with `gh api -X PUT repos/Rivil/price-check/environments/release` plus the deployment-branch-policies POST, then reads it back. No secret value is set.
'''
covers        = ["c-2", "c-4"]
test_contract = [
  '''if refs/tags/v0.1.5 with package 0.1.5 on main does not give {version:'0.1.5', prerelease:false}, or v0.1.5-rc.2 does not give {version:'0.1.5-rc.2', prerelease:true}, release-tag.spec fails''',
  '''if any of v0.1.6 (vs 0.1.5), v0.1.5 with onMain false, '', 'v', v0.1.5-beta.1, v0.1.5-rc, v0.1.5-rc.0, v0.1.5-rc.01, v0.1.5.0, v0.1.5+b1, 'v0.1.5\n', v01.1.5, 0.1.5 (no v) or refs/heads/v0.1.5 is accepted, release-tag.spec's refusal table fails (edge: empty)''',
  '''if a version-mismatch refusal's reason omits either version, release-tag.spec fails''',
  '''if isOnMain is true for a commit reachable only from a side branch, or false for an older commit on main (temp git repo fixture with an origin/main ref), release-tag.spec fails''',
  '''if the CLI writes anything to $GITHUB_OUTPUT or exits 0 for a refused tag or a non-zero ancestor check, release-tag.spec fails (a later job must never read a half-set output)''',
  '''if release.json's custom_branch_policies is not true, protected_branches is not false, or policies is not exactly [{name:'v*', type:'tag'}] (a branch-type 'v*' would let a branch named v1 read the signing secrets), environments.spec fails''',
  '''if release.json has any key matching /secret|CSC_|APPLE_/i, environments.spec fails''',
  '''executor observes `gh api repos/Rivil/price-check/environments/release/deployment-branch-policies` returning exactly one policy {name:'v*', type:'tag'} before committing (output in the task log)''',
]
status        = "done"

[[task]]
id            = "t-4"
wave          = 2
depends_on    = ["t-1"]
title         = "Build update controller, prove rc channels"
files         = ["src/desktop/updater.ts", "src/desktop/updater.spec.ts", "src/desktop/updater-channel.spec.ts"]
description   = "createUpdater({autoUpdater, isPackaged, appVersion, notifier, onReady, timers, log}) over a structural AutoUpdater type (electron / electron-updater as import type only). Inert unless packaged. Packaged: autoDownload true, autoInstallOnAppQuit false (the lifecycle installs), allowDowngrade false, allowPrerelease false; 'error' attached before the first check. Checks at start and every 6 h (UPDATE_CHECK_INTERVAL_MS), skipping while one is in flight; on update-downloaded notifies once per version and calls onReady. Returns start(), stop(), status() ({state, version, notified: string[]}), checkNow(), pending(), installOnExit('quit'|'restart'). publishUpdaterHandle({status, restart, checkNow}) sets Symbol.for('price-check.updater') for the packaged e2e. updater-channel.spec drives electron-updater's real GitHubProvider against a local http fake (releases.atom, /releases/latest, latest.yml). No network. If the real provider contradicts the allowPrerelease pin, the 'rc takes final' / 'final never takes rc' behaviour contracts win and the executor records why.\n"
covers        = ["c-5"]
test_contract = ["if an unpackaged updater calls checkForUpdates, touches autoUpdater or schedules any timer, updater.spec fails", "if start() does not set autoDownload true, autoInstallOnAppQuit false, allowDowngrade false and allowPrerelease false for both '0.1.5' and '0.1.5-rc.1' (the library's own default turns prerelease on for an rc version), updater.spec fails", "if 'error' has no listener when the first check starts, or a rejecting checkForUpdates or an 'error' event throws, leaves an unhandled rejection or stops the next 6 h check, updater.spec fails", "if checkForUpdates is not called once at start, again at exactly 6 h (none at 6 h - 1 ms) and 4 times by 18 h, or a check starts while one is pending, or one runs after stop(), updater.spec fails (fake timers)", "if 'update-downloaded' {version:'0.1.6'} does not give exactly one notifier show (body names 0.1.6 and 'Restart to update') and one onReady('0.1.6'), or a re-emitted 0.1.6 shows again, or a later 0.1.7 does not show, updater.spec fails", "if 48 h of fake timers after a download produce any quitAndInstall call (a forced restart), updater.spec fails", "if installOnExit('quit') with nothing downloaded calls quitAndInstall, or with a download does not call quitAndInstall(true, false) once, or installOnExit('restart') does not call quitAndInstall(true, true), or a throwing quitAndInstall propagates, updater.spec fails", "if status() is not 'idle' -> 'checking' -> 'downloaded' with version 0.1.6 across the events, or the handle's symbol is not Symbol.for('price-check.updater'), updater.spec fails", "if updater.ts (source ?raw) contains setFeedURL, forceDevUpdateConfig, updateConfigPath, a provider/url assignment, or a value import of electron or electron-updater, updater.spec fails (decision update_flow: no runtime feed override)", "if the real GitHubProvider, current 0.1.5-rc.1 configured as createUpdater sets it, feed {v0.1.5 latest, v0.1.5-rc.1 prerelease}, does not resolve 0.1.5, updater-channel.spec 'rc takes final' fails", "if the real GitHubProvider, current 0.1.5, feed {v0.1.6-rc.1 prerelease, v0.1.5 latest}, resolves anything newer than 0.1.5, updater-channel.spec 'final never takes rc' fails", "if the fake server sees any request for rc.yml / rc-*.yml, updater-channel.spec fails (pairs with t-2's detectUpdateChannel false)", "if checkNow() does not trigger exactly one checkForUpdates (none while one is in flight), or status().notified does not list each shown version exactly once (0.1.6 still once after a re-emitted update-downloaded), or the published handle lacks status, restart or checkNow, updater.spec fails (t-12 drives the one-notification check through it)"]
status        = "done"

[[task]]
id            = "t-5"
wave          = 2
depends_on    = ["t-1"]
title         = "Install updates after shutdown, add tray restart"
files         = ["src/desktop/lifecycle.ts", "src/desktop/lifecycle.spec.ts", "src/desktop/tray.ts", "src/desktop/tray.spec.ts"]
description   = '''
LifecycleDeps gains optional updates {pending(), installOnExit(mode)} (absent = unpackaged: nothing installs, main.ts compiles unchanged), predecessorPid (number | null) and isProcessAlive(pid). Tray actions gain restartToUpdate() (mode 'restart', then app.quit()). Quit runs scheduler stop, server close and DB close (or hits the deadline); then, if pending, removes ALERTS_ENCRYPTION_KEY and DATABASE_URL from process.env, sets PRICE_CHECK_PREDECESSOR_PID to its own pid, calls installOnExit(mode), then app.exit(0). A before-quit re-entered after the install is passed over and never hangs the exit. Startup: a lost lock with predecessorPid set polls isProcessAlive until false (cap 30 s), then retries the lock once before quitting as 'second-instance'. TrayHandle gains setUpdateReady(bool), adding 'Restart to update' above Quit. Executor also runs pnpm check.
'''
covers        = ["c-5", "c-6"]
test_contract = [
  '''if Quit with an update pending does not log exactly [stop, closeServer, closeDb, install:quit, exit:0] in lifecycle.spec's call-order log, lifecycle.spec fails (Quit installs; the installer starts only after the DB is closed, c-6)''',
  '''if restartToUpdate() does not log [..., closeDb, install:restart, exit:0], calls app.quit() other than once, or a second restartToUpdate while quitting changes anything, lifecycle.spec fails''',
  '''if a quit with pending() false calls install, or deps without updates (unpackaged) changes the existing quit order, lifecycle.spec fails''',
  '''if closeDb hangs and install runs before SHUTDOWN_DEADLINE_MS elapses, or never runs after it, lifecycle.spec fails (fake timers)''',
  '''if a throwing installOnExit stops app.exit(0), or install runs twice across two quits, lifecycle.spec fails''',
  '''if a before-quit fired by install's own app.quit() leaves the process without app.exit(0) (the hang), lifecycle.spec fails''',
  '''if installOnExit is called without process.env.PRICE_CHECK_PREDECESSOR_PID equal to the running pid, or while process.env still holds ALERTS_ENCRYPTION_KEY or DATABASE_URL (the spawned installer / AppImage would inherit the key), lifecycle.spec fails''',
  '''if any path calls app.relaunch() (the only relaunch is the updater's, after this process exits), lifecycle.spec fails''',
  '''if a lost lock with predecessorPid set quits before isProcessAlive returns false, takes the lock and starts while it is still true, or waits past 30 s, lifecycle.spec fails; with predecessorPid null a lost lock quits at once (the existing second-instance tests keep passing)''',
  '''if the tray menu before setUpdateReady(true) is not exactly Open, Start at login, separator, Quit, or after it lacks exactly one 'Restart to update' item above Quit whose click calls restartToUpdate once, or a second setUpdateReady(true) adds a second item, tray.spec fails''',
]
status        = "done"

