[[task]]
id = "t-32"
wave = 15
title = "Linux packaged update: find B's serving port, not A's inherited one"
files = ["scripts/process-probe.ts", "scripts/process-probe.spec.ts", "e2e/packaged/launch-packaged.ts", "e2e/packaged/update.packaged.ts"]
description = "Root cause from the t-31 capture in CI 44320066854 (642773f), artifact test-reports-linux output-capture-oldest-pid-first.txt. A (pid 10227, server on 127.0.0.1:37443) logged 'Install on explicit quitAndInstall', then 'Executing: <run.exe>', then exit code 0 at 14:14:43.8. B (pid 10328, ppid 1, version 0.1.6) started at 14:14:44.9 and logged '[desktop] listening on http://127.0.0.1:38463' and 'Update for version 0.1.6 is not available'. B has no exit record; the test's cleanup stopped it. So the relaunch works. B also holds A's inherited non-CLOEXEC listening socket, most likely Playwright's DevTools port from A's --remote-debugging-port=0, passed down by electron-updater's AppImage spawn. The Linux probe picked that port for B, and rawRequest timed out on it ('no complete response from 127.0.0.1:<A's port> within 15000ms'). Real users never have that socket. The fix is test-side only. (1) Add a pure helper in scripts/process-probe.ts that picks an instance's serving port from its candidate ports, excluding a given set (A's ports). It returns null when none is left, and refuses to guess if more than one is left (say which). Use it wherever the Linux restart test resolves B's port, so the poll keeps waiting until B serves a port that A never held. The test already records A's ports before 'Restart to update' (t-28). (2) The OS-state snapshot showed 'no instance' while B was alive. Find out why from linuxAppInstances/instancesByPort, for example a port shared with the FUSE daemon or an APPDIR check against A's inherited env, and fix it so B appears. Keep t-28's rule that the runtime or FUSE daemon alone is never an instance. (3) On failure, name the port B announced in its '[desktop] listening on' capture line next to the port probed. Windows and macOS paths unchanged."
covers = ["c-5"]
test_contract = ["If the port picker returns a port that is in the excluded set (A's ports), process-probe.spec fails", "If the port picker guesses when two non-excluded ports remain, or returns a port when none remains, process-probe.spec fails", "If an Electron app process from the mount that also holds an inherited port shared with the FUSE daemon is dropped as an instance, process-probe.spec fails"]
status = "done"
depends_on = ["t-31"]
