title         = "Allowlist phase tests, add packaging dependencies"
files         = [".gitleaks.toml", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "scripts/build-desktop.spec.ts"]
description   = '''
The only wave-1 task; everything depends on it (vitest is red on this branch until the gitleaks entry lands). The .gitleaks.toml tests.json allowlist gains ^\.dross/phases/05-release/tests\.json$. electron-updater (exact x.y.z) joins dependencies; electron-builder and @electron/asar (exact) join devDependencies. pnpm-workspace.yaml gains supportedArchitectures {os:[current], cpu:[current, x64, arm64], libc:[current]}; onlyBuiltDependencies unchanged. Lockfile regenerated; executor observes `pnpm install --frozen-lockfile` clean before commit.
'''
covers        = ["c-1", "c-2", "c-5"]
test_contract = [
  '''if .gitleaks.toml lacks the exact anchored ^\.dross/phases/05-release/tests\.json$ path, gitleaks-config.spec 'every phase allowlisted' fails (red on this branch today)''',
  '''if electron-updater is not an exact x.y.z in `dependencies` (a devDependency is left out of the packaged node_modules and the packaged main.js dies on its bare import), build-desktop.spec 'packaging toolchain' fails''',
  '''if electron-builder or @electron/asar is not an exact x.y.z devDependency, build-desktop.spec 'packaging toolchain' fails''',
  '''if onlyBuiltDependencies gains anything beyond electron and esbuild, the existing build-desktop.spec 'allows install scripts for exactly electron and esbuild' fails''',
  '''if pnpm-workspace.yaml supportedArchitectures.cpu lacks x64 or arm64, or libc widens to musl, build-desktop.spec fails''',
  '''on a darwin host, if @libsql/darwin-arm64/package.json or @libsql/darwin-x64/package.json cannot be resolved from libsql's own directory, build-desktop.spec 'both darwin libsql binaries installed' fails (the universal app would ship one arch); skipped off darwin''',
]
