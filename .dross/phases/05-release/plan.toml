[[task]]
id = "t-26"
wave = 9
title = "Make packaged update e2e failures diagnosable"
files = ["e2e/desktop/launch.ts", "e2e/desktop/harness.e2e.ts", "e2e/packaged/update.packaged.ts", "scripts/process-probe.ts", "scripts/process-probe.spec.ts", ".github/workflows/ci.yml", "scripts/ci-packaged.spec.ts"]
description = "Verify 05-release BLOCKING: CI run 44136073549 'packaged e2e' fails on Linux ('restart through the predecessor wait' hits the 360 s timeout) and Windows ('relaunch after exit': no relaunch within 180 s). A read-only diagnosis (logs in the session scratchpad diag/) could not find the root cause because CI keeps almost no output. Linux: B relaunches and listens, but the unbounded rawRequest at update.packaged.ts:350 (launch.ts:511-540 sets no timeout) suggests B accepts the connection and never answers. Candidates: B inherits A's env and cwd inside A's AppImage mount, or a blocking startup error dialog (main.ts:215-227) under xvfb. Windows: the NSIS --force-run relaunch goes through Explorer, and the probe (update.packaged.ts:284) can't tell 'no process' from 'process with no port'. This task is test-side only, no src/ change: (1) rawRequest takes an optional timeoutMs (setTimeout, destroy with an error); pass about 15 s at update.packaged.ts:295 and :350. (2) On any relaunch-step failure, attach A's app.output() via testInfo.attach, which carries electron-updater's Install/Executing lines. (3) On failure, record OS state: on Linux each holder's /proc/<pid>/status State, wchan and cmdline (extend describeHolders in process-probe.ts); on Windows every windowsAppInstances row incl. those with no port, plus any running price-check-*-win-x64 installer. (4) ci.yml packaged e2e uses --reporter=list. Audit ci.yml against ~/.claude/memory/reference_ci_supply_chain_hardening.md (Universal + Node subset) and report findings. The failing tests stay failing: the follow-up fix task is written from the next CI run's output."
covers = ["c-5", "c-6"]
test_contract = ["If rawRequest with timeoutMs waits past the timeout on a server that accepts but never answers, harness.e2e fails", "If describeHolders drops a holder's process state, wait channel or cmdline on Linux, or a Windows instance row with no port, process-probe.spec fails", "If the packaged e2e step loses its list reporter, ci-packaged.spec fails"]
status = "done"
depends_on = ["t-22"]

[[task]]
id = "t-27"
wave = 10
title = "Linux packaged update: replace the AppImage only once nothing runs it"
files = ["e2e/packaged/update.packaged.ts", "scripts/packaged-app.ts", "scripts/packaged-app.spec.ts"]
description = "Verify 05-release (3cf0e07) BLOCKING: on Linux, CI 'packaged e2e' fails 'restart through the predecessor wait' within 3 ms. placeBuildA (update.packaged.ts:279) calls copyFileSync(buildA, run.exe), which throws ETXTBSY because a process from the previous test ('quit installs in place', which ends with quitCleanly) still has the AppImage at run.exe open for execution, most likely the AppImage runtime or FUSE mount outliving the Electron process. 'relaunch is B with its data' then never runs on Linux. This is a test-side fix only, with no src/ change. (1) Add an exported helper in scripts/packaged-app.ts that replaces an executable atomically: copy to a temp file in the same directory, chmod 0o755, then renameSync over the destination. A running inode is unaffected and the path gets a new inode. (2) Before placeBuildA, wait with a bound (reuse pollFor/appInstances('linux', run.exe) from process-probe) until no instance runs from run.exe. On timeout, throw with describeInstances output so CI shows what is holding it. A lingering B would otherwise make A lose the single-instance lock. (3) placeBuildA uses the helper. Keep every other test's behaviour unchanged."
covers = ["c-5", "c-6"]
test_contract = ["If the replace helper writes into the destination in place instead of renaming a new file over it (destination inode unchanged), packaged-app.spec fails", "If the replace helper leaves the destination non-executable or with the old content, packaged-app.spec fails"]
status = "done"
depends_on = ["t-26"]

[[task]]
id = "t-28"
wave = 11
title = "Linux probe: count only the app's Electron process, not AppImage helpers"
files = ["scripts/process-probe.ts", "scripts/process-probe.spec.ts", "e2e/packaged/launch-packaged.ts", "e2e/packaged/update.packaged.ts"]
description = "CI 44283563089 (32d688a): Linux 'restart through the predecessor wait' failed with 'rawRequest: no complete response from 127.0.0.1:41677/ within 15000ms'. The relaunch probe accepted pid 10253 (ppid 1, state S, wchan fuse_dev_do_read, cmdline = the AppImage path) as B. This is the relaunched AppImage's runtime/FUSE daemon. It most likely holds an orphaned listening socket inherited from A (probably Playwright's DevTools socket, not CLOEXEC) through electron-updater AppImageUpdater.doInstall's spawn (detached, stdio ignore, so libuv closes no extra fds). Nothing accept()s on it. linuxAppInstances (launch-packaged.ts ~671) accepts any pid whose environ has APPIMAGE=run.exe, and the daemon inherited that. No Electron B process was ever seen. Test-side only, no src/ change. (1) Add a pure helper in scripts/process-probe.ts that rejects holders whose /proc/<pid>/exe is the AppImage file itself (the runtime or FUSE daemon) and keeps processes whose exe is under the AppImage mount. linuxAppInstances uses it, so an instance needs an app process from the mount. (2) Before 'Restart to update' in the Linux test, record A's own 127.0.0.1 listen ports (ss) and name them in any failure message. (3) The Linux osState diagnosis lists every process whose APPIMAGE env is run.exe or whose exe is under its mount, listening or not, with exe, ppid, state and wchan, so B's fate (never started, stuck in the predecessor wait, exited) is visible. Keep the other tests' behaviour unchanged."
covers = ["c-5", "c-6"]
test_contract = ["If a holder whose exe is the AppImage file (runtime or FUSE daemon) is counted as an instance, process-probe.spec fails", "If an Electron main whose exe is under the AppImage mount is rejected, process-probe.spec fails", "If a port held only by non-app holders yields an instance, process-probe.spec fails"]
status = "done"
depends_on = ["t-27"]

[[task]]
id = "t-29"
wave = 12
title = "Windows packaged update: realistic NSIS budget, diagnose a slow installer"
files = ["e2e/packaged/update.packaged.ts", "scripts/process-probe.ts", "scripts/process-probe.spec.ts"]
description = "CI 44283563089: Windows 'relaunch after exit' failed with 'no relaunch served from ...Price Check.exe within 180000ms'. The diagnosis showed installer pid 7336 (price-check-0.1.6-win-x64.exe, started 10:23:48) still running after 10:26:51, with no instance. StartApp (--force-run) is the installer's last step, so the relaunch was never reached. The passing run 44262625091 took 2.3 min against the 180 s budget. Record: fail, pass, fail. The cause of the slowness is unknown (candidates: AV scan of the 125 MB package, allowOnlyOneInstallerInstance PowerShell checks, our own probe spawning 1-2 powershell.exe per second). Test-side only. (1) Raise WINDOWS_RELAUNCH_MS to about 420 s, and adjust the test timeout to match. (2) While a price-check-*-win-x64 installer is still running, poll every ~5 s with only the cheap installer check, instead of the full instance probe every 1 s. (3) The failure output names the installer's exit time (or 'still running') and its descendant processes (Win32_Process by ParentProcessId). Put the parse/format of that process tree in scripts/process-probe.ts as a pure helper with a spec. Keep the Linux and macOS paths unchanged."
covers = ["c-6"]
test_contract = ["If the installer-tree helper drops a descendant process (e.g. a grandchild via ParentProcessId) or its name/pid, process-probe.spec fails", "If the installer-tree helper reports a still-running installer as exited (or omits the exit time once it has exited), process-probe.spec fails"]
status = "done"
depends_on = ["t-28"]

[[task]]
id = "t-30"
wave = 13
title = "Linux packaged update: capture the relaunched B's output and exit"
files = ["e2e/packaged/update.packaged.ts", "e2e/packaged/launch-packaged.ts", "e2e/packaged/output-capture.cjs", "scripts/process-probe.ts", "scripts/process-probe.spec.ts", "src/desktop/main.ts", "src/desktop/main.spec.ts"]
description = "CI 44289826311 (9790b1e): Windows and macOS green. Linux 'restart through the predecessor wait' still red: 'A (pid 10140) listened on 127.0.0.1 ports: 37257, 44125, 45413 / rawRequest: no complete response from 127.0.0.1:45413/ within 15000ms'. A process from the AppImage mount briefly held A's inherited socket 45413 (passing t-28's filter), nothing answered, and 15 s later only the FUSE daemon (ppid 1, wchan fuse_dev_do_read) remained. So B started, never served its own port, and exited. Why is unknown because electron-updater's AppImageUpdater spawns B with stdio 'ignore'. This task only makes B's fate visible; the fix comes after the next CI run. (1) Preferred, with no src/ change: the Linux update test launches A with NODE_OPTIONS='--require <abs path to e2e/packaged/output-capture.cjs>' plus a capture-dir env var. B inherits both through the env (lifecycle.ts only strips INHERITED_SECRETS). The .cjs appends per-pid records to <dir>/<pid>.log: start time, argv, ppid, every process.stdout/stderr write, uncaughtException/unhandledRejection, and 'exit' with code and time. First confirm from Electron's docs or source for the installed Electron version (use context7) that a packaged app with default fuses honours NODE_OPTIONS --require. (2) Only if it does not: add the minimal seam in src/desktop/main.ts instead. A test-only env var names a file, main appends its stdout/stderr and exit to it, the variable is deleted from process.env after it is read, as with PREDECESSOR_PID_ENV, and main.spec covers it. (3) On any failure in the Linux restart test, attach every capture file, newest pid last, and name which pid held each of A's ports. Put the pure parse/format of capture records in scripts/process-probe.ts with a spec. Do not touch the Windows or macOS paths, and keep CI behaviour unchanged when the test passes."
covers = ["c-5"]
test_contract = ["If the capture-record formatter drops a record's exit code, its argv, or any stderr line, process-probe.spec fails", "If the formatter orders pids other than oldest-first or loses a pid with no exit record (still running or killed), process-probe.spec fails"]
status = "done"
depends_on = ["t-29"]

