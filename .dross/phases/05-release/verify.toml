[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["e2e/packaged/smoke.packaged.ts:test('empty')", "e2e/packaged/smoke.packaged.ts:test('persists')", "e2e/packaged/smoke.packaged.ts:test('libsql outside asar')", "scripts/verify-packaged.spec.ts:it('fails a libsql binary packed inside app.asar rather than unpacked')", "scripts/ci-packaged.spec.ts:describe('ci.yml runs the packaged steps in the test job on every OS (c-1)')", "scripts/release-workflow.spec.ts:it('Windows: silent install, then verify win, then the smoke on the installed app')"]
  notes = "Breaks if a packaged build opens non-empty, loses a saved watch over relaunch, loads libsql from inside app.asar, or CI drops the smoke. Observed at the measured commit 95bc4f0 in PR CI run 44329632272: empty, persists and libsql-outside-asar passed on macOS, Windows and Linux. The amend's packaged-app.ts change (replaceExecutable) left 2 survivors at :191, accepted (only which ENOENT is reported). The release-artefact smoke is pinned by release-workflow.spec only, until the first tag (see NOTE)."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["scripts/verify-packaged.spec.ts:describe('verifyMac')", "scripts/verify-packaged.spec.ts:it('adds exactly codesign, spctl and stapler on the app when signed')", "scripts/verify-packaged.spec.ts:describe('runCli mac')", "scripts/ci-packaged.spec.ts:it('macOS checks the universal app and both libsql binaries, unsigned')", "scripts/release-workflow.spec.ts:it('signs only on macOS: --sign with the decoded .p8, then verify mac --signed before upload')", "e2e/packaged/smoke.packaged.ts:test('x64 slice')"]
  notes = "Breaks if the app is not fat arm64+x86_64, a darwin libsql binary is missing, or a signing check is skipped or ignored. Observed in run 44329632272 (95bc4f0): the unsigned 'verify packaged' step (lipo + both libsql) and the 'x64 slice' smoke (2.1m) passed on macOS. No 05-release amend touched verify-packaged.ts; no new survivor there. codesign/spctl/stapler run only against fakes until the first tag (NOTE). Gatekeeper open is device UAT."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["scripts/verify-packaged.spec.ts:describe('verifyWin')", "scripts/verify-packaged.spec.ts:it('fails when only HKLM holds the product (no per-user entry)')", "scripts/verify-packaged.spec.ts:it.each(['requireAdministrator', 'highestAvailable'])", "scripts/verify-packaged.spec.ts:describe('aumidCommand')", "scripts/ci-packaged.spec.ts:it('Windows installs silently, then checks the per-user install and the AUMID')", "scripts/package-desktop.spec.ts:it('takes appId from APP_ID and never spells the ID out itself')"]
  notes = "Breaks if the installer needs elevation, installs per-machine, or the Start Menu AUMID differs from APP_ID. Observed: 'verify packaged' (verify win after the silent install) passed on Windows in run 44329632272 (95bc4f0). No new survivor in verify-packaged.ts or package-desktop.ts. SmartScreen is device UAT."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["scripts/release-tag.spec.ts:describe('checkReleaseTag') refusal table incl. multi-digit and anchoring cases", "scripts/release-tag.spec.ts:it('is false for a commit only on a side branch')", "scripts/release-tag.spec.ts:it('as a process: exit codes and output follow the check')", "scripts/release-workflow.spec.ts:it('publish needs exactly the tag and all three builds')", "scripts/release-workflow.spec.ts:it('no job or step runs regardless of failure')", "scripts/release-workflow.spec.ts:describe('publish script under a stub gh')", "scripts/package-desktop.spec.ts:it.each(refusals)('refuses --sign with %s, naming it and printing no value')"]
  notes = "Breaks if a tag off main or not matching package.json, a missing Apple credential, a failed OS build or an existing release still publishes, or an rc is not a pre-release. Each clause has a failing test. Untouched by the amend; release-tag.ts now has 0 Survived (its 11 NoCoverage are the accepted CLI isEntry block). No real tag run has happened yet (NOTE: it fails closed)."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["src/desktop/updater.spec.ts:it('checks at start, at exactly 6 h, and 4 times by 18 h')", "src/desktop/updater.spec.ts:it('notifies once per version and calls onReady once per version')", "src/desktop/updater.spec.ts:it('never restarts by itself: 48 h after a download, no quitAndInstall')", "src/desktop/updater-channel.spec.ts:it('rc takes final: 0.1.5-rc.1 updates to 0.1.5')", "src/desktop/updater-channel.spec.ts:it('final never takes rc: 0.1.5 ignores a newer 0.1.6-rc.1')", "src/desktop/tray.spec.ts:describe('Restart to update (05-release c-5)')", "src/desktop/lifecycle.spec.ts:describe('update install on quit (05-release c-5, c-6)')", "e2e/packaged/update.packaged.ts:test('check at launch'|'downloaded, never a forced restart'|'one notification per version'|'relaunch after exit'|'quit installs in place'|'restart through the predecessor wait'|'relaunch is B with its data')", "scripts/process-probe.spec.ts:describe('servingPort'|'linuxAppHolders'|'isAppImageApp')"]
  notes = "Breaks if checks stop at launch/6 h, a download notifies twice or force-restarts, Restart/Quit does not install, the app does not come back as the new version with its watches, or channels cross. Unit layer covers each clause. CI run 44329632272 (95bc4f0), every packaged update test green. Linux: check, download, one notification, 'quit installs in place' (2.7s), 'restart through the predecessor wait' (6.3s: relaunched pid differs from A, the AppImage is B, B's own port serves the watch) and 'relaunch is B with its data' (2.8s: version B, the watch, integrity_check ok, no 'database is locked'). Windows: check, download, one notification, 'relaunch after exit' (3.8m) and 'relaunch is B with its data'. That closes last verify's BLOCKING. The amend's harness survivors (process-probe.ts, main.ts capture seam) were judged one by one and accepted: equivalent, unreachable, a Stryker static artefact, or failure-only diagnosis text. None of them can turn a failing update into a pass. macOS is device UAT."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["src/desktop/lifecycle.spec.ts:describe('waiting for the version an update replaced (05-release c-6)')", "src/desktop/lifecycle.spec.ts:it('hands over with the key and DB URL gone from the env and this pid as predecessor')", "src/desktop/boundary.spec.ts:it('reads PRICE_CHECK_PREDECESSOR_PID before the loadAdapterHandler call')", "e2e/packaged/update.packaged.ts:test('relaunch after exit')", "e2e/packaged/update.packaged.ts:test('relaunch is B with its data')"]
  notes = "Breaks if B starts before A exits or opens a locked/partial DB. On Windows, 'relaunch after exit' asserts the relaunch's StartTime is after A's exit and that it serves the watch. 'relaunch is B with its data' asserts version B, the watch, integrity_check ok and no 'database is locked'. Both passed on Windows in run 44329632272 at the measured commit 95bc4f0 (and in 44262625091). t-29's 420 s budget and installer-tree diagnosis are harness-only. Their survivors (processTree, startedNoEarlier, describeInstallerTree) only shape failure text and are accepted. The unit tests pin the predecessor wait and lock retry."

