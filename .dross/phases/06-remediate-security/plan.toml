  '''if a blank re-save to the same destination, then a send to the in-repo test SMTP server (src/lib/server/testing/smtp-server.ts), does not AUTH with the original password, smtp.spec 'blank re-save still authenticates' fails (c-20)''',
  '''if ntfyDriver.parseConfig keeps the saved token for a blank token when the topic moves from https://ntfy.a.example/t to https://ntfy.sh/t, to http://ntfy.a.example/t or to https://ntfy.a.example:8443/t, ntfy.spec 'new origin needs the token' fails; a path-only move on the same origin, or an explicit :443, must keep the token''',
  '''if the ntfy fetch stub sees no `Authorization: Bearer <saved>` after a blank same-origin re-save, ntfy.spec fails (c-20)''',
  '''if a blank token on a new origin is refused when the saved token is null, ntfy.spec fails (nothing to leak)''',
  '''if clear_token with a blank token does not give token null with the topic kept, or clear_token plus a typed token returns ok, ntfy.spec fails''',
  '''if saveChannel after a refused destination change wrote anything (decrypted config differs from before), channels.spec 'refused save writes nothing' fails''',
  '''if any refusal message contains the saved or typed secret (sentinel values), either driver spec fails''',
]
