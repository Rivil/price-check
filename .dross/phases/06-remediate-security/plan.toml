title         = "Wrap alerts key with safeStorage"
files         = ["src/desktop/alerts-key.ts", "src/desktop/alerts-key.spec.ts", "src/desktop/main.ts", "e2e/desktop/launch.ts"]
description   = '''
loadOrCreateAlertsKey(keyFile, {safeStorage, platform}) takes a structural, type-only SafeStorage. With a real backend (isEncryptionAvailable, and on Linux a backend of gnome_libsecret or kwallet*), new keys are written wrapped: a non-base64 prefix ('pcw1:') plus the base64 ciphertext, mode 0600. A raw v0.1.5 file is migrated by temp-write, fsync, a decrypt round-trip check, then rename; any failure keeps the raw file and returns its key. A wrapped file whose decrypt throws gives AlertsKeyError naming the path and is never replaced. main.ts passes Electron's safeStorage in every launch. launchDesktop adds --use-mock-keychain on darwin at the launch and relaunch sites, not in electronArgs.
'''
covers        = ["c-24", "c-25"]
test_contract = [
  '''fresh load with a fake darwin backend: if the file parses as raw base64-32 or lacks the 'pcw1:' prefix, alerts-key.spec 'new key wrapped' fails''',
  '''if linux 'basic_text' or isEncryptionAvailable false wraps, or linux 'gnome_libsecret'/'kwallet5' keeps the file raw, alerts-key.spec fails; basic_text must leave raw base64 at 0600 (POSIX)''',
  '''existing raw file plus a real backend: if it does not end wrapped, or the returned key differs from the raw bytes, or a channel sealed under the raw key fails to open with the returned key (crypto.ts openConfig), alerts-key.spec 'migrates v0.1.5 raw key' fails''',
  '''for each failure point (encryptString throws, decryptString returns other bytes, rename throws): if the raw file is not byte-identical afterwards, a temp file remains, or the call does not return the raw key, alerts-key.spec fails''',
  '''if a wrapped file whose decrypt throws is rewritten, deleted or replaced by a new key instead of throwing AlertsKeyError naming the path, alerts-key.spec fails''',
  '''if any thrown or logged text contains the key's base64 or the ciphertext (sentinel), alerts-key.spec fails''',
  '''if two concurrent loads over one raw file return different keys or leave anything but one valid file, alerts-key.spec fails''',
  '''with no safeStorage passed: if behaviour differs from today's, the existing alerts-key.spec rows fail''',
]
