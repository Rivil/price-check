test_contract = [
  '''if smtpDriver.parseConfig with previous {host:'smtp.a.example', port:587, username:'u'} and a blank password accepts host 'smtp.b.example', port 465 or username 'U' (each alone), smtp.spec 'destination change needs the password' fails; the refusal must be {ok:false} with a message containing 'password' and no config''',
