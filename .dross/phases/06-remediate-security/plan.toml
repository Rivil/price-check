files         = ["src/lib/server/checks.ts", "src/lib/server/checks.spec.ts", "src/routes/watches/[id]/page.server.spec.ts"]
description   = '''
checkNow claims the watch with one conditional UPDATE before calling check: SET last_checked_at = now WHERE id = ? AND (last_checked_at IS NULL OR <= now - cooldown) RETURNING id. No row back means cooldown, or not_found if the watch is gone. recordCheck writes the same `now`. A throwing check keeps the claim.
'''
covers        = ["c-4", "c-21"]
test_contract = ["if 5 concurrent checkNow calls for one never-checked watch, with check() held on a deferred promise, call check() more than once, or the other four are not {kind:'cooldown'} with COOLDOWN_MESSAGE, checks.spec 'one fetch per cooldown window' fails (real test DB from src/lib/server/testing/test-db.ts, not a mock)", "if a failing check leaves lastCheckedAt at anything but the attempt time, a checkNow at attempt+14:59.999 calls check, or one at attempt+15:00 does not, checks.spec 'failure starts the cooldown' fails", "if a check() that throws leaves the watch claimable at once, checks.spec 'a thrown check still holds the cooldown' fails", "if checkNow on an unknown id writes anything or returns other than not_found, checks.spec fails", "if dueWatches returns a watch while its Check-now fetch is in flight, checks.spec fails", "if the route's ?/check action returns anything but the existing cooldown failure for the second of two parallel POSTs, watches page.server.spec fails"]
status        = "pending"

