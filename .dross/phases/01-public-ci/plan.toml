description   = "e2e has never run on CI. Locally on macOS it is green: 127 passed in 1.0m on 2026-11-11, before this plan. Prove the gate on GitHub. Push a probe branch `ci-probe/01-public-ci` whose tree is the phase head with .dross/ excluded (dross ship filters .dross/ for the public repo, so the probe does too). Open a DRAFT PR from it into milestone/v0.1, which fires the pull_request workflow. Read `gh pr checks` and fix any OS-specific failure on the phase branch: Windows paths, the `file:e2e/.data/e2e.db` URL, the webServer `&&` chain under cmd, build time against the 180s webServer timeout, libsql native binaries. Each fix gets its own commit and test, then refresh the probe. Files listed are the likely fix sites; a fix elsewhere is added to this task with `dross task edit` before it is made. Locked e2e_gate: if e2e is red, this phase fixes it; never mark a test skip/fixme to get green.\nRed proofs, each pushed to the probe, observed, then reverted: (a) a prettier violation, which turns static red and skips the test jobs; (b) a fake high-entropy generic-api-key line in a new file, which turns gitleaks red (fake value only, never a real credential); (c) a failing expect in one e2e spec, which turns all three test (…) jobs red. Keep the probe PR open for t-7.\nPlan-review amendments: undo each red proof by `git push --force-with-lease` of the probe back to the previous green commit, never `git revert` (a reverted fake key stays in branch history). Also open a second DRAFT probe PR from `ci-probe/01-public-ci-main` into `main` and observe all five checks run green on it, proving the main trigger; close it and delete its branch at the end of this task.\n"
covers        = ["c-1", "c-2"]
test_contract = [
  "if any of static, gitleaks, test (linux), test (macos), test (windows) is not success on the probe PR's final head (which must equal the phase head minus .dross/), c-1/c-2 are unmet; evidence is the `gh pr checks` output for that head SHA",
  "if a pushed prettier violation does not turn `static` red with the three test (…) jobs skipped, the cheap-gates-expensive wiring is broken",
  "if a pushed fake generic-api-key value in a new file does not turn `gitleaks` red, the PR secret gate is broken",
  "if a pushed failing e2e expect does not turn test (linux), test (macos) and test (windows) red, a failing e2e step is not failing its check",
  "if the vitest step on any OS reports fewer test files than the local run (61+ files), a project silently did not run (e.g. the browser 'client' project) and the run does not count",
]
