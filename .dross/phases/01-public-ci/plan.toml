[[task]]
id            = "t-1"
wave          = 1
title         = "Add narrow gitleaks allowlist config"
files         = [".gitleaks.toml"]
description   = "New .gitleaks.toml: `[extend] useDefault = true` plus one `[[allowlists]]` entry per triaged finding group. Full-history scan (gitleaks 8.30.1, `gitleaks git --redact`) today reports 10 findings, all in faff963: the handoff's 9 plus a third k-closure-key hit at src/lib/server/shops/amazon/fixtures/recorded-plain.html:9695 (same Amazon page-config value, covered by locked decision fixture_findings).\nInline `gitleaks:allow` markers cannot clear these: a history scan reads faff963's patch, which has no marker. So allowlisting is config-only, and each entry is narrow:\n- recorded-{plain,plain2,deal}.html: targetRules = [\"generic-api-key\"], paths = the three exact files (anchored ^…$), regexTarget = \"match\", regexes = ['k-closure-key'], condition = \"AND\" (the default OR would allow the whole file). Fixtures stay byte-for-byte; never re-recorded.\n- resend.spec.ts (16, 252), ntfy.spec.ts (325), routes/account/alerts/page.server.spec.ts (32, 470): targetRules = [\"generic-api-key\"], exact file paths, regexes pinned to the specific fake values, condition = \"AND\".\n- testing/fixtures/smtp-test-localhost.key and smtp-test-untrusted.key: targetRules = [\"private-key\"], the two exact file paths (rule+path).\nNo directory globs, no stopwords that would match real keys, no .gitleaksignore. Each entry carries a `description` saying why the value is not a secret. Never print finding secrets while working: always --redact, read reports as RuleID/File/StartLine only. Local `gitleaks dir` also flags the gitignored .env; that is out of scope (CI checkouts have no .env).\nBefore committing, run `gitleaks dir --config .gitleaks.toml --redact` over the working tree too, so the new .gitleaks.toml itself (which holds pinned fake-value regexes) is scanned before it enters history.\n"
covers        = ["c-3"]
test_contract = [
  "if any of the 10 history findings is left unallowlisted, `gitleaks git --config .gitleaks.toml --redact --exit-code 1` over the full history exits 1 naming that file:line (expected: exit 0, zero findings)",
  "if any single [[allowlists]] entry is deleted from a scratch copy of the config, the same full-history scan exits 1 with a finding in exactly that entry's file(s) (proves every entry is load-bearing)",
  "in a scratch copy of the tree, if a new high-entropy generic-api-key assignment appended to resend.spec.ts or recorded-deal.html is NOT reported by `gitleaks dir --config .gitleaks.toml`, the allowlist is file-wide rather than value-scoped and the check fails",
  "in a scratch copy, if a new PEM private key written to src/lib/server/testing/fixtures/other-test.key is NOT reported, the private-key allowlist is directory-wide and the check fails",
]
status        = "done"

[[task]]
id            = "t-2"
wave          = 1
title         = "Add workflow SHA-pin and permissions checker"
files         = ["scripts/workflow-policy.ts", "scripts/workflow-policy.spec.ts", "package.json", "vite.config.ts", "stryker.config.json", "tsconfig.json"]
description   = "scripts/workflow-policy.ts: a pure checker (exported function over file name + YAML text → list of violations with file:line) plus a CLI entry run under Node type stripping (`node scripts/workflow-policy.ts`), exposed as `pnpm ci:policy`. No new dependencies (no YAML library, no zizmor/actionlint download): line-based reading that fails closed on anything it cannot classify.\nRules: every `uses:` must be `./local-path` or `owner/repo[/path]@<40 lowercase hex>` (tags, branches, short SHAs, docker:// refs without @sha256 → violation). Workflow-level `permissions:` must be present and be exactly `contents: read`. Any job-level `permissions:` may only be `{}`, `contents: read` or `contents: none`. Exception hook (coordinator decision, for 05-release): export a `WRITE_SCOPE_ALLOWLIST` map of workflow file name → allowed job-level write scopes; it ships EMPTY in this phase, so today any write scope is still a violation. A listed workflow may grant only its listed scopes, only at job level, never at workflow level. Test both: empty list rejects; a listed workflow passes only for its listed scope. `write-all`, `read-all`, any other scope, any `: write`, and flow-style `permissions: { … }` → violation. The CLI scans .github/workflows/*.yml and *.yaml, prints each violation, and exits non-zero on any violation or when it finds no workflow file (a wrong path must not pass vacuously).\nvite.config.ts: the 'server' vitest project also includes scripts/**/*.{test,spec}.{js,ts}. stryker.config.json mutates scripts/**/*.ts too (minus specs) so dross verify can mutate the checker. tsconfig.json: add \"scripts\" to `include` so pnpm check typechecks scripts/** (today it covers only src + root configs). Make sure pnpm lint covers scripts/.\nCLI shape (review finding): export `runPolicyCli(workflowDir: string, log?): number` returning the exit code; the CLI entry is a one-line wrapper calling process.exit(runPolicyCli(...)). Tests call runPolicyCli in-process against temp dirs, never via a spawned node, so Stryker can credit the mutants.\n"
covers        = ["c-5"]
test_contract = ["if `uses: actions/checkout@v4`, `@main`, or a 7-char short SHA is accepted, the workflow-policy.spec 'unpinned uses' table test fails; a 40-hex ref and `./.github/actions/x` must pass it", "if a workflow with no top-level permissions block, `permissions: write-all`, `permissions: read-all`, top-level `contents: write`, or job-level `pull-requests: write` / `id-token: write` is accepted, the 'permissions' table test fails", "if flow-style `permissions: { contents: write }` or any permissions form the checker cannot classify is accepted, the 'fails closed' test fails", "if a violation's report does not carry the file name and 1-based line of the offending line, the 'locates' test fails", "if runPolicyCli returns 0 when the workflow dir holds no workflow file, or when one file has a violation, the 'cli exit' test fails (in-process, no spawned node)", "if, with WRITE_SCOPE_ALLOWLIST empty, a job-level `contents: write` is accepted — or, with a test-injected allowlist {'release.yml': ['contents']}, release.yml's job-level `contents: write` is rejected, its `packages: write` accepted, or a workflow-level `contents: write` accepted — the 'write-scope allowlist' test fails"]
status        = "done"

