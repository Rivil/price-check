[[task]]
id            = "t-4"
wave          = 2
depends_on    = ["t-1", "t-2"]
title         = "Add hardened 3-OS PR workflow"
files         = [".github/workflows/ci.yml", ".node-version", ".gitattributes", "playwright.config.ts", ".github/workflows/audit.yml"]
description   = ".github/workflows/ci.yml, triggered only by `pull_request` into `main` and `milestone/**` (locked gated_refs). No push trigger (no post-merge re-runs), no pull_request_target, no paths filters (a filtered-out PR would never report its required checks).\nHardening (reference_ci_supply_chain_hardening, Universal + Node/pnpm): top-level `permissions: contents: read`, no job-level permissions. Every action is pinned to a full 40-hex commit SHA with a `# vX.Y.Z` comment, resolved with `git ls-remote` at authoring time, never typed from memory (actions/checkout, actions/setup-node, pnpm/action-setup, actions/cache, actions/upload-artifact, nothing else). checkout uses `persist-credentials: false`. Node is pinned exactly via .node-version (24.14.0, the version observed locally). pnpm comes from package.json packageManager (pnpm@10.33.4). Install is `pnpm install --frozen-lockfile`. Dependency build scripts stay default-denied by pnpm 10 apart from the existing `onlyBuiltDependencies: [esbuild]`, which must not be widened. No `@latest`, no `npx`/`pnpm dlx` of unpinned tools.\nCost (reference_ci_pipeline_optimisation): `concurrency` per PR number with cancel-in-progress. `timeout-minutes` on every job. Cheap jobs gate the matrix: `static` (ubuntu-24.04: pnpm lint, pnpm check, pnpm ci:policy as separate steps) and `gitleaks` (ubuntu-24.04: checkout fetch-depth 0; download the gitleaks 8.30.1 linux_x64 release tarball and verify it against a sha256 pinned in the workflow before running; then `gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1`; no gitleaks-action). Then one merged `test` job per OS, with `needs: [static, gitleaks]` and fail-fast false. Matrix include: linux/ubuntu-24.04, macos/macos-15, windows/windows-2025, job name `test (${{ matrix.name }})` so the required-check names survive a runner-image bump. Each runs pnpm install, then Playwright chromium (cached on runner.os + hashFiles('pnpm-lock.yaml'), `--with-deps`/install-deps on Linux only), then `pnpm test:unit --run`, then `pnpm test:e2e`. Unit and e2e run in one job so each OS pays for one VM, one install and one browser install. playwright-report and test-results are uploaded only `if: failure()`, retention 7 days (the repo is public, but artifacts hold only seeded test data). Required-check names end up as: static, gitleaks, test (linux), test (macos), test (windows).\n.gitattributes: add `* text=auto eol=lf` (all 235 tracked text files are already LF, so nothing renormalises) and `-text` on src/lib/server/shops/**/fixtures/*.html and the test PEM/key fixtures, so Windows checkouts keep them byte-for-byte and prettier --check is not tripped by CRLF.\nplaywright.config.ts: `forbidOnly: !!process.env.CI` and `retries: 0`, so a stray test.only cannot turn a run vacuously green.\nPlan-review amendments (coordinator-accepted):\n- Workflow-level `defaults: run: shell: bash`, so Windows runners don't use PowerShell (which only surfaces the last command's exit code).\n- gitleaks runs as `gitleaks git --log-opts=HEAD --config .gitleaks.toml --redact --no-banner --exit-code 1`: the full history of the code under review only, not every fetched branch (otherwise one bad side branch turns every PR red).\n- The pinned gitleaks sha256 comes from the release's published checksums file, cross-checked against a local download of the same tarball; record both observations in the task notes.\n- Set `PLAYWRIGHT_BROWSERS_PATH` to one workspace-relative path at workflow level so the browser cache path/key works on all three OSes.\n- .github/workflows/audit.yml (separate, NOT a required check): `pnpm audit --audit-level=high --prod` on pull_request with `paths: [pnpm-lock.yaml, package.json]` plus a weekly `schedule`. Same hardening as ci.yml (SHA pins, contents: read, bash shell, frozen lockfile); must pass ci:policy.\n"
covers        = ["c-1", "c-2", "c-5"]
test_contract = [
  "if any `uses:` in ci.yml is not a 40-hex SHA, or ci.yml grants anything beyond `contents: read`, `pnpm ci:policy` exits non-zero (expected: exit 0 on the committed ci.yml)",
  "if a `test.only` is added to any *.e2e.ts, `CI=1 pnpm test:e2e` exits non-zero with Playwright's forbidOnly error (checked locally, then the test.only is removed)",
  "if the gitleaks tarball's sha256 does not match the pinned value, the gitleaks job fails at the verify step before gitleaks runs (checked by reading the step: verification precedes execution and uses `sha256sum -c` or an equivalent strict compare)",
  "if lint, check or ci:policy fails, the static job fails and all three `test (…)` jobs are skipped (needs: [static, gitleaks]); proven on GitHub in t-6",
  "if `git ls-files --eol` shows any tracked text file changing to i/crlf, or `git add --renormalize .` produces a diff, the .gitattributes change is unsafe and the task fails",
]
status        = "done"

