description   = "Commit the two ruleset bodies and apply them with `gh api` to Rivil/price-check: POST /repos/Rivil/price-check/rulesets, or PUT /rulesets/<id> when a ruleset of that name already exists, so the step is idempotent. Not `dross protect --apply`: it derives checks from workflows on origin/main (none until the milestone merges), and its milestone ruleset requires no checks, which contradicts locked gated_refs.\nmain.json: target branch, include refs/heads/main, enforcement active. Rules: pull_request (0 approvals), required_status_checks (static, gitleaks, test (linux), test (macos), test (windows), each with integration_id 15368 = GitHub Actions so another app cannot spoof them, strict policy false), deletion, non_fast_forward.\nmilestone.json: include refs/heads/milestone/**. Rules: pull_request + the same required_status_checks. No deletion rule, because dross milestone --finalize deletes the branch.\nBoth: bypass_actors = [{actor_type RepositoryRole, actor_id 5 (admin), bypass_mode always}] only (locked protection_bypass). Also set repo allow_auto_merge = true (what dross protect --apply would do, so dross's chore-PR route can auto-merge) and confirm actions default_workflow_permissions is still read.\nscripts/rulesets.spec.ts keeps the JSON and ci.yml in step.\nAfter the proofs: close the probe PR and delete the probe branch.\nPlan-review amendments (coordinator-accepted):\n- Ruleset names are \"ci: main\" and \"ci: milestones\" (deliberately NOT dross's own names). Never run `dross protect --apply` on this repo: it would create duplicate rulesets without the admin bypass.\n- Mirror dross's full pull_request rule parameter set from ~/Development/dross/internal/protect/ruleset.go (read it, ~lines 8-13, 66-72, 84-95): required_approving_review_count 0, require_extra_approval_for_unattributed_changes false (explicitly; GitHub defaults it on), dismiss_stale_reviews_on_push false, require_code_owner_review false, require_last_push_approval false, required_review_thread_resolution false, allowed_merge_methods [\"merge\",\"squash\"].\n- Probe proofs: `gh pr ready` the probe before the proofs and `gh pr ready --undo` after (draft PRs report DRAFT, never BLOCKED).\n- Ordering: apply the rulesets last, after everything else in the phase is green. The coordinator then ships phase 01 into milestone/v0.1 and merges milestone/v0.1 into main straight away, so both branches carry ci.yml before any chore PR needs the checks.\n"
