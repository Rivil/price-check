  '''if an unpackaged run with the variable unset, empty or 'yes' gets anything but the real class, notify-seam.spec fails''',
  '''if in 'record' mode a show() is not appended to shown with its exact title and body, or click(i) does not fire the 'click' listener of the i-th instance only, notify-seam.spec fails''',
  '''if in 'unsupported' mode isSupported() is not false, notify-seam.spec fails''',
  '''if click(i) for an index never shown throws in main instead of rejecting with a message naming the index, notify-seam.spec fails''',
]
