files         = ["src/desktop/window.ts", "src/desktop/window.spec.ts"]
description   = '''
showWindow(state, path?) builds the URL with new URL(path, origin) and falls back to origin for one that fails isAppUrl. createMainWindow takes the URL to load, so a new window loads the target as its first and only loadURL. A live window is restored if minimised, loads the target, then shows and focuses. Without a path, a live window is not reloaded.
'''
