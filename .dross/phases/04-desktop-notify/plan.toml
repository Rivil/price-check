test_contract = [
  '''if showWindow(state, '/watches/w1') on a destroyed or never-created window creates a window whose loadURL calls are not exactly [origin + '/watches/w1'] (origin first = a double load), window.spec fails''',
  '''if showWindow(state, '/watches/w1') on a minimised live window does not restore(), loadURL(origin + '/watches/w1') once, show() and focus(), or creates a second BrowserWindow, window.spec fails''',
  '''if a path of '//evil.example/x', 'https://evil.example/' or '/\\evil.example' leads to loadURL with any non-app origin, window.spec's path table fails (each must load the origin)''',
  '''if showWindow(state) with no path calls loadURL on an already-open window (tray Open or a second instance would lose the current page), window.spec fails''',
]
status        = "pending"

