[[task]]
id            = "t-6"
wave          = 3
depends_on    = ["t-1", "t-2"]
title         = "Add desktop driver and install helper"
files         = ["src/lib/server/alerts/desktop.ts", "src/lib/server/alerts/desktop.spec.ts"]
description   = '''
createDesktopDriver(notifier, {watchExists}) (watchExists async): kind 'desktop', defaultKinds ['price_drop'], parseConfig -> ok({}) ignoring the form, view -> {}. send maps Alert to DesktopNotice (title, message verbatim); clickPath resolves at click time: test -> '/account/alerts', a live watchId -> '/watches/' + encodeURIComponent(id), a gone one -> '/'. Notifier 'unsupported' -> reason 'unsupported', 'failed' -> 'refused', a throw -> 'unreachable'; send never throws. installDesktop(db, key, notifier, {watchExists}) registers the driver, calls ensureChannel(db, key, 'desktop', {priceDrops:true, checkFailures:false}) and returns the unregister. desktop.spec drives alertAfterSuccess/alertAfterFailure over createTestDb() with a fake notifier and, where named, a saved ntfy channel with a fake fetch (r-01).
'''
covers        = ["c-1", "c-2", "c-3", "c-4", "c-5"]
test_contract = [
  '''if, with installDesktop on an empty DB and no other channel, a check at 900 against a 1000 target does not end in exactly one show whose title contains the watch's title and whose body contains '£9.00' and '£10.00' (outcome 'sent', not 'no_channel'), desktop.spec fails (c-1)''',
  '''if, with ntfy (fake fetch) also saved, the same drop does not reach both (fetch once, one show), desktop.spec fails (c-1 adjacency)''',
  '''if, with ntfy and desktop routed and the notifier returning {ok:false,'failed'}, ntfy is not sent and recorded, or the next check re-sends ntfy or does not retry desktop, desktop.spec 'desktop failure isolated' fails''',
  '''if a second alertAfterSuccess at 900 or 850 shows again (desktop outcome must be 'already_sent'), desktop.spec 'once per target' fails (c-3)''',
  '''if price 1100 then 900 does not show a second time, or changing the target 1000 -> 950 with price 900 does not show on the next check, desktop.spec fails (c-3 re-arm)''',
  '''if a show resolving {ok:false,'unsupported'} or {ok:false,'failed'} leaves a price_drop_delivery row for (watch,'desktop'), or the next check (notifier now ok) does not show, desktop.spec fails (delivery_result: retried)''',
  '''if a show resolving ok does not record the delivery row, so the next at-target check shows again, desktop.spec fails (delivery_result: no flood)''',
  '''if send returns anything but {ok:false, reason:'unsupported'} for an unsupported notifier or reason 'refused' for 'failed', or rejects when the notifier throws (must be 'unreachable'), desktop.spec fails''',
  '''if clickPath() resolves anything but '/watches/a%2Fb%3Fc' for a live watch with id 'a/b?c', '/' once that watch is deleted, or '/account/alerts' for a 'test' alert, desktop.spec fails (c-2, click_target)''',
  '''if a check_failed alert to desktop carries a clickPath that resolves to the shop URL instead of '/watches/<id>', desktop.spec fails''',
  '''if alertAfterFailure with only the seeded desktop channel shows anything (failed checks off by default), or a desktop channel disabled via setEnabled still shows a drop, desktop.spec fails (c-4)''',
  '''if installDesktop over a row the user set to {enabled:false, priceDrops:false, checkFailures:true} changes any flag, or a second installDesktop adds a row, desktop.spec 'seed never overwrites' fails''',
  '''if, with no installDesktop, channelKinds() includes 'desktop' or saveChannel(..., 'desktop', ...) succeeds, or the unregister returned by installDesktop leaves 'desktop' in channelKinds(), desktop.spec fails (desktop_only_driver; no cross-spec leak)''',
]
status        = "pending"

