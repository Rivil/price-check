[phase]
  id = "02-single-user"
  title = "02-single-user"
  milestone = "v0.1"

[[criteria]]
  id = "c-1"
  text = "With a fresh database, / shows the empty watchlist directly: no login screen, no redirect, no account setup."

[[criteria]]
  id = "c-2"
  text = "The server starts and serves every page with BETTER_AUTH_SECRET unset; only DATABASE_URL and ALERTS_ENCRYPTION_KEY are required."

[[criteria]]
  id = "c-3"
  text = "/login, /logout, /account/password, /admin/users/* and /api/auth/* all return 404."

[[criteria]]
  id = "c-4"
  text = "The header has no Sign out or Admin link, and every page has a footer 'Source' link to https://github.com/Rivil/price-check (AGPL-3.0 §13)."

[[criteria]]
  id = "c-5"
  text = "Watches, price history and alert channels created in one server run are all present after a restart on the same DB file."

[[criteria]]
  id = "c-6"
  text = "A form POST to any action with a foreign Origin header is rejected with 403."

[[criteria]]
  id = "c-7"
  text = "A request whose Host is not localhost or 127.0.0.1 (any port) is rejected with 403 (DNS-rebinding guard)."

[[decisions]]
  key = "data_scope"
  choice = "Drop the better-auth tables and every user_id column/index; data is owned by the install, not a user row. Multi-user DBs are unsupported."
  why = "Single local user is locked; a phantom user row keeps the auth schema half alive. No desktop installs exist yet and importing old server data is a milestone non-goal."
  locked = true

[[decisions]]
  key = "removed_routes"
  choice = "Auth, account-password and admin routes are deleted and 404; no redirects to /."
  why = "Redirects would keep dead URLs looking supported; 404 makes the removal testable and honest."
  locked = true

[[decisions]]
  key = "local_request_guard"
  choice = "Keep SvelteKit's CSRF origin check on, and add a Host-header loopback check in hooks for every request, /health included."
  why = "With no auth, any web page the user visits could reach the local server via cross-origin POST or DNS rebinding; these two checks are the whole access control now."
  locked = true

[[deferred]]
  text = "Generate ALERTS_ENCRYPTION_KEY on first launch and persist it under userData, so no env is needed"
  why = "Needs the Electron main process and app.getPath('userData'), which 03-desktop-shell creates"
  target = "03-desktop-shell"
