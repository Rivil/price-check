phases = ["01-public-ci", "02-single-user", "03-desktop-shell", "04-desktop-notify", "05-release"]

[milestone]
  version = "v0.1"
  title = "Installable desktop app: signed, self-updating, native alerts"
  status = "active"
  started = "2026-11-11"
  base = "main"

[scope]
  success_criteria = ["From a GitHub Release, a user installs on macOS (signed + notarised, opens without a Gatekeeper override), Windows (installer; only the SmartScreen warning) and Linux (AppImage), and reaches an empty watchlist with no login, no .env and no config step.", "With the window closed, the app keeps running from the tray, starts at login, allows only one instance, and keeps checking watches on schedule, including catching up after sleep.", "When a watched price reaches its target, a native OS notification appears on macOS, Windows and Linux with no channel setup, and clicking it opens that watch in the app.", "Pushing a version tag makes CI build the macOS, Windows and Linux artefacts and publish a GitHub Release. An installed older version on each OS updates itself to it without the user downloading anything.", "Every PR to main runs tests, typecheck, lint and gitleaks in GitHub Actions and is blocked on failure. gitleaks on the full repo reports zero unallowlisted findings."]
  non_goals = ["AppImage only on Linux: no .deb or .rpm packages in v0.1 (electron-updater cannot update them)", "No app-store distribution: no Mac App Store, Microsoft Store, Snap or Flathub", "No import of watches or price history from the old amazon-price-check server database", "No rework of the existing ntfy, Resend and SMTP channel setup UI. Only the desktop notification channel is new"]
