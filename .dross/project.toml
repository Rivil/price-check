[project]
  name = "price-check"
  version = "0.1.3.0"
  created = "2026-11-11"
  description = "Cross-platform desktop app that watches shop prices from your own connection and sends a native notification when a target is hit."

[stack]
  languages = ["typescript"]
  profile = "typescript"
  package_manager = "pnpm"
  frameworks = ["sveltekit", "svelte5", "electron"]
  test_runner = "vitest + playwright"
  type_checker = "svelte-check"
  linter = "eslint"
  formatter = "prettier"

[[stack.locked]]
  choice = "SvelteKit (Svelte 5) full-stack TypeScript, adapter-node"
  why    = "One TS codebase for the watchlist UI, the in-process scheduler and the shop adapters. The adapter-node server runs inside Electron's main process as a long-lived local server, so the scheduler lives alongside it"
  locked_at = "2026-11-11"

[[stack.locked]]
  choice = "Drizzle ORM on SQLite"
  why    = "Single-user data fits in one file under app.getPath('userData'). No database to install, and Drizzle gives a typed schema and migrations"
  locked_at = "2026-11-11"

[[stack.locked]]
  choice = "Shop adapter interface. The amazon.co.uk adapter uses HTTP fetch + HTML parsing, with a headless browser only as fallback"
  why    = "Keeps other shops pluggable. Plain fetch is the cheap path, and Electron's bundled Chromium becomes the natural browser fallback for bot walls"
  locked_at = "2026-11-11"

[[stack.locked]]
  choice = "Electron desktop shell. The main process runs the adapter-node server on 127.0.0.1 and a BrowserWindow loads it. electron-builder packages it and electron-updater updates it from GitHub Releases. macOS is signed and notarised; Windows is unsigned"
  why    = "Friends install once and it updates itself, with no Docker or self-hosting. Checks run from each user's own connection, and the backend is already Node, so Tauri buys nothing"
  locked_at = "2026-11-11"

[[stack.locked]]
  choice = "Desktop only, single local user, no auth. The server mode and better-auth are being removed"
  why    = "Each install belongs to one person on their own machine, so accounts, login and admin pages are dead weight"
  locked_at = "2026-11-11"

[[stack.locked]]
  choice = "pnpm with the native Node toolchain, no Docker"
  why    = "Electron has to build and run natively on macOS, Windows and Linux. Docker served the dropped self-hosted deploy target only"
  locked_at = "2026-11-11"

[runtime]
  mode = "native"
  dev_command = "pnpm dev"
  test_command = "pnpm test:unit --run"
  typecheck_command = "pnpm check"
  format_command = "pnpm format"
  build_command = "pnpm build"
  lint_command = "pnpm lint"
  migrate_command = "DATABASE_URL=file:local.db pnpm db:migrate"

[runtime.services.app]
  url    = "http://localhost:5173"
  health = "/"
  note   = "Vite dev server (pnpm dev), native"

[repo]
  layout = "single"
  git_main_branch = "main"
  squash_merge = false
  commit_convention = "conventional"
  branch_pattern = "phase/<slug>"

[remote]
  url = "https://github.com/Rivil/price-check"
  provider = "github"
  public = true
  api_base = "https://api.github.com"
  log_api = true
  auth_env = "GITHUB_TOKEN"

[paths]

[env]

[goals]
  core_value = "A friend installs it once and gets reliable price alerts with no further setup, checked from their own IP."
  audience = "Anyone who installs it from GitHub Releases. Mostly non-technical desktop users (macOS, Windows, Linux), each running their own local install."
  non_goals = [
    "No central service. No hosted backend checks prices for users: every check runs on the user's own machine and connection",
    "No multi-user desktop. Desktop builds are single-user and local, with no accounts, login or admin pages",
    "No auto-buying. It sends an alert and you buy",
    "No shops beyond amazon.co.uk for now. Other shops are future work, so the shop adapter interface stays pluggable rather than Amazon-hardwired",
    "No deal-discovery feed. It tracks only items you explicitly watch and does not browse or recommend",
  ]
  differentiators = [
    "Checks run from each user's own IP. There is no central service to block, rate-limit or shut down",
    "Native desktop notifications on macOS, Windows and Linux, with no account, phone app or notification service needed",
    "Open source (AGPL-3.0-or-later), installs once and updates itself from GitHub Releases",
  ]

[[competition]]
  name = "Keepa / CamelCamelCamel"
  url  = "https://keepa.com"
  note = "Hosted Amazon trackers with deep history and alerts. Free tiers are email-only or limited, Keepa's richer alerts and API need Pro, and your watchlist lives on someone else's service"

[[competition]]
  name = "PriceBuddy"
  url  = "https://github.com/jez500/pricebuddy"
  note = "Self-hosted Laravel/Filament tracker with generic any-store scraping (optional AI parsing) and many notifiers (ntfy, Gotify, Telegram...). Closest match, but the PHP stack is heavy and generic scraping is fragile on Amazon"

[[competition]]
  name = "Discount Bandit"
  url  = "https://github.com/Cybrarist/Discount-Bandit"
  note = "Self-hosted multi-user Laravel/Filament tracker with per-store support (Amazon, eBay, AliExpress...) and criteria-based alerts. Broad store list, but the same heavy PHP stack"
