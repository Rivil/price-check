# PR gate for main and milestone/* (spec 01-public-ci: c-1, c-2, c-5).
#
# Hardening (supply chain): every action is pinned to a full commit SHA, the token
# is read-only, the install is frozen to the lockfile, and pnpm 10 keeps dependency
# build scripts denied (pnpm-workspace.yaml onlyBuiltDependencies). `pnpm ci:policy`
# enforces the first two on every workflow file, including this one.
#
# Cost: the cheap Linux jobs (static, gitleaks) gate the three-OS test matrix.
# Required check names: static, gitleaks, test (linux), test (macos), test (windows).
name: ci

on:
  pull_request:
    branches: [main, 'milestone/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners otherwise default to PowerShell, which only surfaces the
    # last command's exit code.
    shell: bash

env:
  GITLEAKS_VERSION: 8.30.1
  # From gitleaks_8.30.1_checksums.txt, cross-checked against a local download.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm check
      - name: workflow policy
        run: pnpm ci:policy

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c --strict -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: scan full history of the code under review
        # --log-opts=HEAD: only the PR's own history, not every fetched branch.
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --config .gitleaks.toml \
            --redact --no-banner --exit-code 1

  test:
    name: test (${{ matrix.name }})
    needs: [static, gitleaks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
    env:
      # One path on every OS, so the browser cache below works everywhere.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: install chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi
      - name: unit tests
        run: pnpm test:unit --run
      - name: diag seed/build/preview stages
        continue-on-error: true
        env:
          DATABASE_URL: file:e2e/.data/e2e.db
          ORIGIN: http://localhost:4173
          BETTER_AUTH_SECRET: diag-only-secret-0123456789abcdef0123
          ALERTS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SCHEDULER_DISABLED: '1'
        run: |
          set +e
          node --trace-uncaught e2e/seed.ts; echo "DIAG seed exit $?"
          node --input-type=module -e "import {createClient} from '@libsql/client';const c=createClient({url:'file:e2e/.data/diag.db'});const r=await c.execute('select 1');console.log('DIAG libsql ok',r.rows.length);c.close();console.log('DIAG closed')"; echo "DIAG libsql-min exit $?"
          pnpm build > /dev/null 2>&1; echo "DIAG build exit $?"
          timeout 25 pnpm preview > preview.log 2>&1; echo "DIAG preview exit $?"; tail -5 preview.log
      - name: e2e tests
        run: pnpm test:e2e
        env:
          CI: 'true'
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
