# Release pipeline (spec 05-release: c-1, c-2, c-4; decisions release_pipeline and
# release_secrets, amended by 06-remediate-security signing_job_split: c-8, c-15,
# c-26). Pinned by scripts/release-workflow.spec.ts; `pnpm ci:policy` checks SHA pins,
# permissions, what a secret-bearing job may run and the .p8 cleanup.
#
# A pushed v* tag runs: tag (is it vX.Y.Z[-rc.N] on main, matching package.json?)
# -> one build per OS -> publish (one GitHub Release with every file at once). Windows
# and Linux each package, verify (layout, fuses), run the packaged smoke and upload.
# macOS takes three jobs: build-macos packages the app unsigned, sign-macos signs and
# notarises that exact .app, verify-macos verifies and smokes the signed release and
# uploads it. Any failed job publishes nothing.
#
# Hardening (supply chain): every action is pinned to a full commit SHA; every job
# reads only, except publish, which holds the one contents: write and runs no repo or
# dependency code (gh plus the first-party download-artifact action). No actions/cache
# and no setup-node cache: a PR-populated cache is a route into a release build.
# Frozen lockfile; pnpm 10 keeps dependency build scripts denied. Only sign-macos takes
# the 'release' environment, and only its sign step reads the signing credentials. It
# installs signing/ alone (electron-builder, its own frozen lockfile, no scripts) and
# runs scripts/sign-mac.ts: no project install, build or test code runs where the
# Developer ID certificate or the notary key can be read (SEC-09). It downloads the
# unsigned tar into RUNNER_TEMP, never over the checkout, and unpacks it only once it
# is the one file build-macos packed, by sha256 (SEC-18).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One run per tag, never cancelled halfway: a cancelled run could leave a signed
# build notarised but unpublished, and a re-run must start from a clean slate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Windows runners otherwise default to PowerShell.
    shell: bash

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # Full history, so origin/main is there for the reachability check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The runner's default Node may not strip types; .node-version's does. No
      # install: release-tag.ts uses Node built-ins only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: check the tag
        id: check
        run: node scripts/release-tag.ts

  # No environment and no secrets: the project install and build run here.
  build-macos:
    name: build (macos)
    needs: [tag]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    # sign-macos unpacks the tar only if its sha256 is this one (SEC-18).
    outputs:
      unsigned-sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: build
        run: |
          pnpm build
          pnpm build:desktop
        env:
          # The vite build validates src/env.ts, which requires DATABASE_URL. The
          # packaged app sets the real one in userData at launch (server-env.ts).
          DATABASE_URL: file:build-only.db
      # Unsigned: sign-macos signs and notarises this exact .app.
      - name: package (unsigned)
        run: pnpm package:desktop --version "$RELEASE_VERSION"
      # A tar, not the bare .app: upload-artifact drops the framework symlinks and the
      # exec bits a signed bundle needs.
      - name: pack the unsigned app
        id: pack
        run: |
          set -euo pipefail
          tar -cf mac-unsigned.tar -C dist-packaged mac-universal
          echo "sha256=$(shasum -a 256 mac-unsigned.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned
          path: mac-unsigned.tar
          if-no-files-found: error
          retention-days: 7

  # The only job holding the five release secrets: it runs no project install, build
  # or test, only signing/'s install and scripts/sign-mac.ts (`pnpm ci:policy` enforces
  # it).
  sign-macos:
    name: sign (macos)
    needs: [tag, build-macos]
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Into a fresh dir under RUNNER_TEMP, never over the checkout: the artefact comes
      # from the build job, and extracted into the workspace it could replace
      # scripts/sign-mac.ts, which runs below with the signing secrets (SEC-18).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned
          path: ${{ runner.temp }}/macos-unsigned
      # Only exactly one regular file, mac-unsigned.tar, whose sha256 is build-macos's
      # output, is unpacked, and into dist-packaged: tar refuses .. and symlinked paths,
      # so nothing lands in scripts/ or signing/. The sha256 arrives by env, never
      # spliced into the script.
      - name: check and unpack the unsigned app
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          set -- "$RUNNER_TEMP/macos-unsigned"/*
          test "$#" -eq 1
          test "$1" = "$RUNNER_TEMP/macos-unsigned/mac-unsigned.tar"
          test -f "$1"
          test ! -L "$1"
          printf '%s  %s\n' "$UNSIGNED_SHA256" "$1" | shasum -a 256 -c --strict -
          mkdir -p dist-packaged
          tar -xf "$RUNNER_TEMP/macos-unsigned/mac-unsigned.tar" -C dist-packaged
        env:
          UNSIGNED_SHA256: ${{ needs.build-macos.outputs.unsigned-sha256 }}
      - name: install the signing toolchain
        run: pnpm install --dir signing --ignore-workspace --frozen-lockfile --ignore-scripts
      # The trap is set before the key is written, so the decoded .p8 leaves
      # RUNNER_TEMP when this step exits, passed or failed (c-15).
      - name: sign and notarise
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          node scripts/sign-mac.ts --version "$RELEASE_VERSION" --app "dist-packaged/mac-universal/Price Check.app"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # The signed .app and the release files it was wrapped in, for verify-macos.
      - name: pack the signed release
        run: tar -cf mac-signed.tar -C dist-packaged .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed
          path: mac-signed.tar
          if-no-files-found: error
          retention-days: 7

  # No environment and no secrets: verifies and smokes the signed release, then
  # uploads the files publish ships.
  verify-macos:
    name: verify (macos)
    needs: [tag, sign-macos]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed
      - name: unpack the signed release
        run: |
          mkdir -p dist-packaged
          tar -xf mac-signed.tar -C dist-packaged
      - name: verify layout
        run: node scripts/verify-packaged.ts layout dist-packaged --version "$RELEASE_VERSION" --mode release
      - name: verify universal, signed, notarised
        run: node scripts/verify-packaged.ts mac "dist-packaged/mac-universal/Price Check.app" --signed
      - name: verify fuses
        run: node scripts/verify-packaged.ts fuses "dist-packaged/mac-universal/Price Check.app"
      - name: locate the packaged app
        run: |
          exe="$(node scripts/packaged-app.ts exe dist-packaged)"
          echo "PRICE_CHECK_PACKAGED_EXE=$exe" >> "$GITHUB_ENV"
      - name: packaged smoke
        run: pnpm test:e2e:packaged
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            dist-packaged/*.dmg
            dist-packaged/*.zip
            dist-packaged/*.blockmap
            dist-packaged/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build (windows)
    needs: [tag]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: build
        run: |
          pnpm build
          pnpm build:desktop
        env:
          # The vite build validates src/env.ts, which requires DATABASE_URL. The
          # packaged app sets the real one in userData at launch (server-env.ts).
          DATABASE_URL: file:build-only.db
      # Never signed: Windows ships unsigned (SmartScreen only).
      - name: package
        run: pnpm package:desktop --version "$RELEASE_VERSION"
      - name: verify layout
        run: node scripts/verify-packaged.ts layout dist-packaged --version "$RELEASE_VERSION" --mode release
      - name: silent install, verify per-user install and shortcut
        run: |
          exe="$(node scripts/packaged-app.ts install dist-packaged)"
          node scripts/verify-packaged.ts win dist-packaged
          echo "PRICE_CHECK_PACKAGED_EXE=$exe" >> "$GITHUB_ENV"
      # The installed exe: the binary the installer ships.
      - name: verify fuses
        run: node scripts/verify-packaged.ts fuses "$PRICE_CHECK_PACKAGED_EXE"
      - name: packaged smoke
        run: pnpm test:e2e:packaged
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            dist-packaged/*.exe
            dist-packaged/*.blockmap
            dist-packaged/latest.yml
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build (linux)
    needs: [tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: build
        run: |
          pnpm build
          pnpm build:desktop
        env:
          # The vite build validates src/env.ts, which requires DATABASE_URL. The
          # packaged app sets the real one in userData at launch (server-env.ts).
          DATABASE_URL: file:build-only.db
      - name: package
        run: pnpm package:desktop --version "$RELEASE_VERSION"
      - name: verify layout
        run: node scripts/verify-packaged.ts layout dist-packaged --version "$RELEASE_VERSION" --mode release
      # The unpacked binary the AppImage wraps: the AppImage's own squashfs is
      # compressed, so its fuse wire cannot be read in place.
      - name: verify fuses
        run: node scripts/verify-packaged.ts fuses dist-packaged/linux-unpacked/price-check-app
      - name: locate the packaged app
        run: |
          exe="$(node scripts/packaged-app.ts exe dist-packaged)"
          echo "PRICE_CHECK_PACKAGED_EXE=$exe" >> "$GITHUB_ENV"
      # The AppImage needs FUSE 2 (README). Ubuntu 24.04's AppArmor denies the
      # unprivileged user namespaces Chromium's sandbox needs: lift that rather than
      # run without the sandbox, and give Electron a virtual display.
      - name: packaged smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm test:e2e:packaged
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            dist-packaged/*.AppImage
            dist-packaged/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    # verify-macos, not sign-macos: a signed build that failed verification never ships.
    needs: [tag, verify-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Same-run artefacts download with the runtime token: no actions: read needed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      # The file list mirrors scripts/packaged-app.ts expectedArtefacts for darwin,
      # win32 and linux (release-workflow.spec compares them). It is spelled out here
      # because this job runs no node.
      - name: create the release
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG is not v$VERSION: publishing nothing"
            exit 1
          fi
          case "$PRERELEASE" in
            true) flags=(--prerelease) ;;
            false) flags=() ;;
            *) echo "::error::prerelease output is '$PRERELEASE', not true or false"; exit 1 ;;
          esac
          required=(
            "price-check-$VERSION-mac-universal.dmg"
            "price-check-$VERSION-mac-universal.dmg.blockmap"
            "price-check-$VERSION-mac-universal.zip"
            "price-check-$VERSION-mac-universal.zip.blockmap"
            "latest-mac.yml"
            "price-check-$VERSION-win-x64.exe"
            "price-check-$VERSION-win-x64.exe.blockmap"
            "latest.yml"
            "price-check-$VERSION-linux-x86_64.AppImage"
            "latest-linux.yml"
          )
          cd release-files
          expected="$(printf '%s\n' "${required[@]}" | LC_ALL=C sort)"
          actual="$(ls -A | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the downloaded files are not the release set: publishing nothing"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty: publishing nothing"
              exit 1
            fi
          done
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          if grep -Fxq -- "$TAG" <<<"$existing"; then
            echo "::error::a release or draft for $TAG already exists: publishing nothing"
            exit 1
          fi
          gh release create "$TAG" "${required[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Price Check $VERSION" ${flags[@]+"${flags[@]}"}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
